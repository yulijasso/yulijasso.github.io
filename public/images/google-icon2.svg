  <rect x="24" y="23" width="2" height="4" fill="#EA4335"/>
  <rect x="19" y="22" width="7" height="2" fill="#EA4335"/>
  <!-- search box -->
  <rect x="8" y="30" width="24" height="2" fill="#C0C0C0"/>
